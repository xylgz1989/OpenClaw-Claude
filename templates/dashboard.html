<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OpenClaw Claude Config{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .nav-link {
            transition: all 0.2s;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .card {
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .badge-success {
            background-color: #10b981;
        }
        .badge-warning {
            background-color: #f59e0b;
        }
        .badge-danger {
            background-color: #ef4444;
        }
        .badge-info {
            background-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold">OpenClaw Claude Config</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="nav-link px-3 py-2 rounded">首页</a>
                    <a href="/providers" class="nav-link px-3 py-2 rounded">提供商</a>
                    <a href="/quota" class="nav-link px-3 py-2 rounded">配额</a>
                    <a href="/alerts" class="nav-link px-3 py-2 rounded">告警</a>
                    <a href="/config" class="nav-link px-3 py-2 rounded">配置</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 OpenClaw. All rights reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
